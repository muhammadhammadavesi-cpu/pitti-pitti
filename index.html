<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pitti pitti tame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --s: 1;
    --u: calc(var(--s) * 1px);
    --bg: #FFD84D;
    --rays: #FFE37F;
    --dots: rgba(240, 67, 58, .15);
    --ground: #38C9A0;
    --ground-shade: #2DB08A;
    --ink: #1B1340;
    --paper: #FFF6DC;
    --hot: #F0433A;
    --text: #1B1340;
    --display: 'Titan One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2B1B63;
      --rays: #34237C;
      --dots: rgba(255, 216, 77, .10);
      --ground: #157A69;
      --ground-shade: #106657;
      --text: #FFF6DC;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2B1B63;
    --rays: #34237C;
    --dots: rgba(255, 216, 77, .10);
    --ground: #157A69;
    --ground-shade: #106657;
    --text: #FFF6DC;
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background-image: url(back.jpg);
    background-size: cover;
    background-position: center;
  }
  .page { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  /* header */
  .top { position: relative; z-index: 4; padding: 16px 16px 4px; text-align: center; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(36px, 7vw, 66px);
    line-height: 1;
    color: var(--paper);
    -webkit-text-stroke: 9px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--ink);
    transform: rotate(-1.5deg);
    display: inline-block;
  }
  .status {
    margin: 12px auto 0;
    max-width: 30em;
    min-height: 2.7em;
    font-weight: 800;
    font-size: clamp(15px, 2.6vw, 19px);
    line-height: 1.3;
    text-wrap: balance;
  }

  /* stage */
  .stage { position: relative; z-index: 1; flex: 1 1 0; min-height: 0; display: flex; justify-content: center; align-items: center; }
  .scene { position: relative; flex: none; width: calc(640 * var(--u)); height: calc(500 * var(--u)); }
  .scene::before {
    content: '';
    position: absolute;
    z-index: 0;
    left: 50%;
    bottom: calc(-100vh);
    width: 200vw;
    height: calc(70 * var(--u) + 100vh);
    transform: translateX(-50%);
    border-top: 4px solid var(--ink);
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(118 * var(--u)), var(--ground-shade) calc(118 * var(--u)) calc(122 * var(--u))),
      var(--ground);
    box-sizing: border-box;
  }
  .shadow { position: absolute; border-radius: 50%; background: rgba(20, 10, 50, .28); filter: blur(calc(1.5 * var(--u))); }

  .girl-rig { position: absolute; z-index: 3; left: calc(457 * var(--u)); bottom: calc(40 * var(--u)); width: calc(138 * var(--u)); height: calc(320 * var(--u)); }
  .girl-rig .shadow { left: calc(-8 * var(--u)); bottom: calc(-9 * var(--u)); width: calc(154 * var(--u)); height: calc(20 * var(--u)); }
  .girl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  .pivot { position: absolute; left: calc(9 * var(--u)); top: calc(44 * var(--u)); width: 0; height: 0; transform-origin: 0 0; transform: scale(-1, 1) rotate(-85deg); }
  .bat {
    position: absolute;
    left: calc(-6.5 * var(--u));
    top: calc(-178 * var(--u));
    width: calc(185 * var(--u));
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 calc(3 * var(--u)) calc(2 * var(--u)) rgba(20, 10, 50, .35));
  }

  .boy {
    position: absolute; z-index: 2; bottom: calc(30 * var(--u));
    margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border-radius: calc(16 * var(--u));
  }
  .boy:focus-visible { outline: 4px solid var(--hot); outline-offset: 4px; }
  .boy-img { position: absolute; left: 50%; bottom: 0; width: calc(230 * var(--u)); height: calc(300 * var(--u)); margin-left: calc(-115 * var(--u)); transform-origin: 50% 100%; pointer-events: none; }
  .boy-img .shadow { left: calc(25 * var(--u)); bottom: calc(-11 * var(--u)); width: calc(180 * var(--u)); height: calc(22 * var(--u)); }
  .boy-img img { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-user-drag: none; }

  .fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .burst { position: absolute; width: calc(165 * var(--u)); height: calc(165 * var(--u)); }
  .burst svg { width: 100%; height: 100%; overflow: visible; }
  .burst text { font-family: var(--display); fill: var(--ink); text-anchor: middle; }

  .bubble { position: absolute; width: calc(160 * var(--u)); text-align: center; }
  .bubble span {
    display: inline-block;
    position: relative;
    padding: calc(6 * var(--u)) calc(14 * var(--u));
    border: calc(3 * var(--u)) solid var(--ink);
    border-radius: calc(16 * var(--u));
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    font-size: max(13px, calc(17 * var(--u)));
    line-height: 1.15;
  }
  .bubble span::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: calc(12 * var(--u));
    height: calc(12 * var(--u));
    background: var(--paper);
    border-right: calc(3 * var(--u)) solid var(--ink);
    border-bottom: calc(3 * var(--u)) solid var(--ink);
    transform: translate(-50%, -55%) rotate(45deg);
  }

  .dizzy { position: absolute; width: calc(80 * var(--u)); height: calc(80 * var(--u)); transform: scaleY(.38); }
  .dizzy .orb { position: absolute; inset: 0; animation: spin .75s linear 2; }
  .dizzy i {
    position: absolute; left: 50%; top: 50%;
    font-style: normal;
    font-size: max(14px, calc(24 * var(--u)));
    line-height: 1;
    color: #FFC61A;
    text-shadow: 0 0 0 var(--ink), 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
    transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(-32 * var(--u)));
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { position: absolute; z-index: 5; pointer-events: none; }

  /* controls */
  .bar { position: relative; z-index: 4; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 12px 14px 16px; }
  .btn {
    font-family: var(--body);
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink);
    box-sizing: border-box;
    min-height: 44px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn { border-radius: 14px; padding: 4px 18px; font-family: var(--display); font-weight: 400; cursor: pointer; box-shadow: 0 4px 0 var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:focus-visible { outline: 4px solid var(--hot); outline-offset: 3px; }
  .scene::before {
    display: none;
}
</style>
</head>

      </button>

      <div class="hint bubble" id="hint"><span>whack him</span></div>
      <div class="fx" id="fx"></div>
    </div>
  </section>

  <footer class="bar">
    <button class="btn" id="reset" type="button">Stretch him back</button>
  </footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const rig = $('rig'), pivot = $('pivot'), boy = $('boy'), boyImg = $('boyImg'), boyPic = $('boyPic');
  const scene = $('scene'), fx = $('fx'), hint = $('hint');
  const reduceQ = matchMedia('(prefers-reduced-motion: reduce)');

  // Scene geometry, in design units (scene is 640 x 500)
  const GIRL_L = 45, GIRL_W = 138, HAND_X = 174, HAND_Y = 316;
  const BOY_CX = 505, BOY_W = 230, BOY_H = 300, BOY_BOTTOM = 30;
  const BAT_L = 240, REST = -85, WIND = -92;
  const MIN = 0.24, FACTOR = 0.82;

  let S = 1, sc = 1, hits = 0, busy = false;
  const muted = false;

  function fit() {
    const r = $('stage').getBoundingClientRect();
    S = Math.max(0.2, Math.min(r.width / 600, r.height / 500));
    root.style.setProperty('--s', S.toFixed(4));
  }
  new ResizeObserver(fit).observe($('stage'));
  fit();

  const U = v => `calc(${v} * var(--u))`;
  // geometry math below is written for a boy on the right; X() mirrors it so the boy is on the left
  const X = v => 640 - v;
  const rot = a => `scale(-1,1) rotate(${a}deg)`;
  const headX = sz => X(BOY_CX) - 0.23 * BOY_W * sz; // actual x of his head
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function play(el, frames, opts) {
    const a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts));
    return a.finished.then(() => { try { a.commitStyles(); } catch (e) {} a.cancel(); });
  }

  function sizeBoyButton() {
    const w = Math.max(BOY_W * sc, 96), h = Math.max(BOY_H * sc, 120);
    boy.style.width = U(w);
    boy.style.height = U(h);
    boy.style.left = U(X(BOY_CX) - w / 2);
  }
  sizeBoyButton();

  function ui(message) {
    if (message) $('status').textContent = message;
  }

  /* ---------- sound ---------- */
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f0, f1, dur, type, vol) {
    if (muted || !ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, f0, f1) {
    if (muted || !ac) return;
    const t = ac.currentTime, len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const fl = ac.createBiquadFilter(); fl.type = 'bandpass';
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(fl).connect(g).connect(ac.destination);
    src.start(t);
  }
  const sfxSwing = () => noise(0.16, 0.3, 500, 2800);
  const sfxHit = () => { tone(210, 45, 0.24, 'sine', 0.9); noise(0.07, 0.6, 2000, 900); };
  const sfxSqueak = size => tone(480 + (1 - size) * 1200, 900 + (1 - size) * 1500, 0.17, 'triangle', 0.22);

  /* ---------- effects ---------- */
  const WORDS = ['BONK', 'WHACK', 'THWACK', 'SMACK', 'POW', 'BOP', 'CLONK', 'BAM'];
  const LINES = ['Ow! itna zor se maar rahi hein ap chota ho gaya mein', 'ayiiii!', 'Ouch!', 'mummaaaa!', "bas bas ro dunga mein!", 'ayiiii bas bas!', 'have mercy yar!', 'ooo gaya mein.'];
  const LINES_MIN = ["itne pyaare insaan se maar khane me bhi maza aa raha hy!", 'marein bhale khair hy!', 'nahi nahi zor se lag rahi hy'];
  let lastWord = -1;

  function burstSVG(word) {
    const pts = (rMin, rMax, jit) => {
      let p = '';
      for (let i = 0; i < 32; i++) {
        const a = (i / 32) * Math.PI * 2;
        const r = (i % 2 ? rMin : rMax) * (1 + (Math.random() - .5) * jit);
        p += (r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1) + ' ';
      }
      return p;
    };
    const size = word.length <= 4 ? 25 : word.length === 5 ? 20 : 17;
    return `<svg viewBox="-65 -65 130 130" aria-hidden="true">
      <polygon points="${pts(38, 62, .18)}" fill="#F0433A" stroke="#1B1340" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="${pts(30, 46, .1)}" fill="#FFD84D"/>
      <text x="0" y="${size * 0.36}" font-size="${size}" transform="rotate(${(Math.random() * 14 - 7).toFixed(1)})">${word}!</text>
    </svg>`;
  }

  function spawn(html, cls, x, y, w, h) {
    const el = document.createElement('div');
    el.className = cls;
    el.style.left = U(X(x) - w / 2);
    el.style.bottom = U(y - h / 2);
    el.innerHTML = html;
    fx.appendChild(el);
    return el;
  }

  function showBurst(x, y) {
    let i; do { i = Math.floor(Math.random() * WORDS.length); } while (i === lastWord);
    lastWord = i;
    const el = spawn(burstSVG(WORDS[i]), 'burst', x, y, 165, 165);
    if (reduceQ.matches) { setTimeout(() => el.remove(), 700); return; }
    el.animate([
      { transform: 'scale(.2) rotate(-14deg)', opacity: 1 },
      { transform: 'scale(1.15) rotate(3deg)', opacity: 1, offset: .25 },
      { transform: 'scale(1) rotate(0deg)', opacity: 1, offset: .7 },
      { transform: 'scale(1.05) rotate(0deg)', opacity: 0 }
    ], { duration: 780, easing: 'ease-out' }).finished.then(() => el.remove());
  }

  function showBubble(text, size) {
    fx.querySelectorAll('.bubble').forEach(b => b.remove());
    const y = BOY_BOTTOM + BOY_H * size + 26;
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.left = U(headX(size) - 80);
    el.style.bottom = U(y);
    el.innerHTML = '<span></span>';
    el.firstChild.textContent = text;
    fx.appendChild(el);
    if (reduceQ.matches) { setTimeout(() => el.remove(), 1600); return; }
    el.animate([
      { transform: 'scale(.4) translateY(10px)', opacity: 0 },
      { transform: 'scale(1.08)', opacity: 1, offset: .2 },
      { transform: 'scale(1)', opacity: 1, offset: .3 },
      { transform: 'scale(1)', opacity: 1, offset: .82 },
      { transform: 'scale(.9)', opacity: 0 }
    ], { duration: 1700 }).finished.then(() => el.remove());
  }

  function showStars(size) {
    if (reduceQ.matches) return;
    const y = BOY_BOTTOM + BOY_H * size - 4;
    const el = spawn('<div class="orb"><i style="--a:0deg">★</i><i style="--a:120deg">★</i><i style="--a:240deg">★</i></div>', 'dizzy', X(headX(size)), y, 80, 80);
    el.animate([{ opacity: 1 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: 1500 }).finished.then(() => el.remove());
  }

  function shake() {
    if (reduceQ.matches) return;
    const d = 6 * S;
    scene.animate([
      { transform: 'translate(0,0)' },
      { transform: `translate(${-d}px, ${d * .5}px)` },
      { transform: `translate(${d * .8}px, ${-d * .4}px)` },
      { transform: `translate(${-d * .5}px, ${d * .3}px)` },
      { transform: 'translate(0,0)' }
    ], { duration: 240 });
  }

  /* ---------- the whack ---------- */
  async function whack() {
    if (busy) return;
    busy = true;
    audio();
    hint.style.display = 'none';
    const reduce = reduceQ.matches;

    const prev = sc;
    const next = Math.max(MIN, +(prev * FACTOR).toFixed(4));
    const shrank = next < prev - 0.001;

    // aim the bat at the boy's current size
    const left = BOY_CX - BOY_W * prev / 2;
    const h = BOY_H * prev;
    const targetX = left + Math.min(26, BOY_W * prev * 0.2);
    const targetY = BOY_BOTTOM + 0.7 * h;
    const dy = HAND_Y - targetY;
    let gx = Math.sqrt(Math.max((0.9 * BAT_L) ** 2 - dy * dy, 60 * 60));
    let lunge = targetX - gx - HAND_X;
    lunge = Math.max(30, Math.min(lunge, left - 14 - (GIRL_L + GIRL_W)));
    gx = targetX - (HAND_X + lunge);
    const phi = Math.atan2(dy, gx) * 180 / Math.PI;
    const hitAng = Math.min(45 + phi, 125);
    const px = -lunge * S;

    if (!reduce) {
      // wind up while stepping in
      await Promise.all([
        play(rig, [{ transform: 'translateX(0)' }, { transform: `translateX(${px}px)` }], { duration: 300, easing: 'cubic-bezier(.2,.8,.3,1)' }),
        play(pivot, [{ transform: rot(REST) }, { transform: rot(WIND) }], { duration: 300, easing: 'ease-out' })
      ]);
      await sleep(60);
      sfxSwing();
      await play(pivot, [{ transform: rot(WIND) }, { transform: rot(hitAng) }], { duration: 140, easing: 'cubic-bezier(.55,0,.9,.4)' });
    } else {
      rig.style.transform = `translateX(${px}px)`;
      pivot.style.transform = rot(hitAng);
      await sleep(150);
    }

    // impact
    sc = next; hits++;
    sfxHit();
    showBurst(targetX, targetY);
    shake();
    let line;
    if (!shrank) line = LINES_MIN[(hits + 1) % LINES_MIN.length];
    else line = LINES[Math.min(hits - 1, LINES.length - 1)];
    showBubble(line, next);
    showStars(next);
    setTimeout(() => sfxSqueak(next), 260);
    ui(shrank
      ? `arey yar koi nahi bhale marein ap yayyyyy`
      : `omggg kitni pyaari lag rahi hein ap maarte huwe `);

    let boyDone;
    if (!reduce) {
      const push = -16 * S;
      boyPic.animate([{ filter: 'none' }, { filter: 'brightness(1.9) saturate(.4)', offset: .15 }, { filter: 'none' }], { duration: 420 });
      boyDone = play(boyImg, [
        { transform: `translateX(0) rotate(0deg) scale(${prev},${prev})`, offset: 0 },
        { transform: `translateX(${push}px) rotate(-7deg) scale(${prev * 1.28},${prev * 0.62})`, offset: .16 },
        { transform: `translateX(${push * .3}px) rotate(3deg) scale(${next * .82},${next * 1.22})`, offset: .42 },
        { transform: `translateX(0) rotate(-1.5deg) scale(${next * 1.08},${next * .94})`, offset: .68 },
        { transform: `translateX(0) rotate(0deg) scale(${next},${next})`, offset: 1 }
      ], { duration: 640, easing: 'ease-out' });
      await sleep(90); // brief hit-stop, bat stays planted
      await play(pivot, [{ transform: rot(hitAng) }, { transform: rot(hitAng + 12) }], { duration: 130, easing: 'ease-out' });
      await sleep(140);
      await Promise.all([
        boyDone,
        play(rig, [{ transform: `translateX(${px}px)` }, { transform: 'translateX(0)' }], { duration: 380, easing: 'ease-in-out' }),
        play(pivot, [{ transform: rot(hitAng + 12) }, { transform: rot(REST) }], { duration: 380, easing: 'ease-in-out' })
      ]);
    } else {
      boyImg.style.transform = `scale(${next},${next})`;
      await sleep(500);
      rig.style.transform = 'translateX(0)';
      pivot.style.transform = rot(REST);
    }

    sizeBoyButton();
    busy = false;
  }

  async function reset() {
    if (busy) return;
    busy = true;
    audio();
    fx.querySelectorAll('.bubble, .dizzy').forEach(e => e.remove());
    const from = sc;
    sc = 1; hits = 0;
    ui('Stretched back to full size. Tap him again.');
    if (from < 0.999) {
      tone(300, 900, 0.35, 'triangle', 0.25);
      if (reduceQ.matches) boyImg.style.transform = 'scale(1,1)';
      else await play(boyImg, [
        { transform: `scale(${from},${from})` },
        { transform: 'scale(.92,1.14)', offset: .45 },
        { transform: 'scale(1.1,.9)', offset: .68 },
        { transform: 'scale(.98,1.03)', offset: .85 },
        { transform: 'scale(1,1)' }
      ], { duration: 800, easing: 'ease-out' });
    }
    sizeBoyButton();
    busy = false;
  }

  boy.addEventListener('click', whack);
  $('reset').addEventListener('click', reset);

  // hint above the boy at the start
  hint.style.left = U(headX(1) - 80);
  hint.style.bottom = U(BOY_BOTTOM + BOY_H + 24);
})();
</script>
</body>
</html>
